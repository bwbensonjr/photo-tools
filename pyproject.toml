[project]
name = "photo-tools"
version = "0.1.0"
description = "Tools for organizing and tagging scanned family photographs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.58.1",
    "google-auth-oauthlib>=1.4.1",
    "keyring>=25.7.0",
    "requests>=2.34.2",
]

[project.scripts]
scan-metadata = "photo_tools.scan_metadata:main"
google-photos-upload = "photo_tools.google_photos_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_tools"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
